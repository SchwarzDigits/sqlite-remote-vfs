name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Commit of github.com/SchwarzDigits/sqlite-remote-server that the tests run against. Raised deliberately, after
  # the server's own CI passed.
  SERVER_VERSION: 99278476f50615773c3413b78b0a502ab5626901

# Every job starts that server with the start-server action, which sets SQLITE_REMOTE_TEST_URL. The tests that need a
# server skip themselves without it. The native and browser jobs start a second one that admits only clients with an
# access token (SQLITE_REMOTE_TEST_GATED_URL), for the token tests.
jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
          port: "18091"
          url-variable: SQLITE_REMOTE_TEST_GATED_URL
          token-jwks-file: crates/sqlite-remote-vfs/tests/data/token-jwks.json
          token-issuer: sqlite-remote-vfs-tests
          token-leeway: 1s
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Server log
        if: failure()
        shell: pwsh
        run: |
          Get-Process sqlite-remote-server -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sqlite-remote-server*.log') | ForEach-Object { "== $_"; Get-Content $_ }

  postgres:
    name: End-to-end with PostgreSQL (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vfs
          POSTGRES_PASSWORD: vfs
          POSTGRES_DB: vfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfs"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
          store: postgres
          database-url: postgres://vfs:vfs@127.0.0.1:5432/vfs?sslmode=disable
      - name: Remote and TLS tests
        run: cargo test -p sqlite-remote-vfs --test remote --test tls
      # Kills a writing process at random and checks that no acknowledged commit is lost.
      - name: Crash test
        run: cargo run -p sqlite-remote-harness -- crash --url "$SQLITE_REMOTE_TEST_URL" --iterations 5

  extension:
    name: Extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            extension -> target
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
      # The tests load the extension from target/debug.
      - name: Build the extension
        run: cargo build -p sqlite-remote-vfs-ext
      - name: Format
        working-directory: extension
        run: cargo fmt --check
      - name: Clippy
        working-directory: extension
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: extension
        run: cargo test
      - name: Server log
        if: failure()
        shell: pwsh
        run: |
          Get-Process sqlite-remote-server -ErrorAction SilentlyContinue
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sqlite-remote-server*.log') | ForEach-Object { "== $_"; Get-Content $_ }

  sqlcipher:
    name: SQLCipher (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sqlcipher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sqlcipher -> target
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  browser:
    name: Browser (Firefox, Chrome, Edge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: browser -> target
      # Must match the wasm-bindgen version in browser/Cargo.lock.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-bindgen@0.2.128
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
          port: "18091"
          url-variable: SQLITE_REMOTE_TEST_GATED_URL
          token-jwks-file: crates/sqlite-remote-vfs/tests/data/token-jwks.json
          token-issuer: sqlite-remote-vfs-tests
          token-leeway: 1s
      # Relay in front of the first server, which heal.rs stops and resumes through the control port.
      - name: Start relay
        run: |
          nohup python3 relay.py 127.0.0.1:18090 18092 18093 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 50); do
            curl -sf http://127.0.0.1:18093/resume > /dev/null && break
            sleep 0.2
          done
          echo "SQLITE_REMOTE_TEST_RELAY_URL=ws://127.0.0.1:18092/v1/ws" >> "$GITHUB_ENV"
          echo "SQLITE_REMOTE_TEST_RELAY_CONTROL=http://127.0.0.1:18093" >> "$GITHUB_ENV"
      # The runner image has llvm-ar only under a versioned name.
      - name: Find llvm-ar
        run: |
          name=$(compgen -c llvm-ar | grep -E '^llvm-ar(-[0-9]+)?$' | sort -t- -k3 -n | tail -1)
          echo "AR_wasm32_unknown_unknown=$(command -v "$name")" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The runner image provides drivers that match its browsers.
      - name: Test in Firefox
        run: GECKODRIVER="$GECKOWEBDRIVER/geckodriver" ./test.sh --firefox
      - name: Test in Chrome
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" ./test.sh --chrome
      # On a fresh runner the first start of Edge under msedgedriver sometimes never finishes loading its first page,
      # and the test runner waits until its timeout. Later starts are not affected, and a first start without the
      # driver finishes. So start Edge once before the tests.
      - name: Start Edge once
        run: |
          timeout --kill-after=5 120 microsoft-edge --headless --no-sandbox --disable-dev-shm-usage \
            --dump-dom 'data:text/html,' > /dev/null 2>&1 || true
      - name: Test in Edge
        run: MSEDGEDRIVER="$EDGEWEBDRIVER/msedgedriver" ./test.sh --edge

  safari:
    name: Browser (Safari)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: browser -> target
      # Must match the wasm-bindgen version in browser/Cargo.lock.
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-bindgen@0.2.128
      # The system ar cannot index WebAssembly objects, and the runner's Xcode clang has no WebAssembly target. The
      # image has LLVM from Homebrew, possibly versioned. test.sh takes clang from the same directory as llvm-ar.
      - name: Find llvm-ar
        run: |
          ar=$(ls -d "$(brew --prefix)"/opt/llvm*/bin/llvm-ar 2> /dev/null | tail -1)
          if [ -z "$ar" ]; then
            brew install llvm
            ar="$(brew --prefix llvm)/bin/llvm-ar"
          fi
          echo "AR_wasm32_unknown_unknown=$ar" >> "$GITHUB_ENV"
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
      - uses: ./.github/actions/start-server
        with:
          version: ${{ env.SERVER_VERSION }}
          port: "18091"
          url-variable: SQLITE_REMOTE_TEST_GATED_URL
          token-jwks-file: crates/sqlite-remote-vfs/tests/data/token-jwks.json
          token-issuer: sqlite-remote-vfs-tests
          token-leeway: 1s
      # Relay in front of the first server, which heal.rs stops and resumes through the control port.
      - name: Start relay
        run: |
          nohup python3 relay.py 127.0.0.1:18090 18092 18093 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 50); do
            curl -sf http://127.0.0.1:18093/resume > /dev/null && break
            sleep 0.2
          done
          echo "SQLITE_REMOTE_TEST_RELAY_URL=ws://127.0.0.1:18092/v1/ws" >> "$GITHUB_ENV"
          echo "SQLITE_REMOTE_TEST_RELAY_CONTROL=http://127.0.0.1:18093" >> "$GITHUB_ENV"
      # Safari only accepts WebDriver sessions after remote automation is enabled. It has no headless mode.
      - name: Enable Safari's WebDriver
        run: sudo safaridriver --enable
      - name: Test in Safari
        run: SAFARIDRIVER=/usr/bin/safaridriver ./test.sh --safari
