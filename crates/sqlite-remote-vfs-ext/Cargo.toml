[package]
name = "sqlite-remote-vfs-ext"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "sqlite-remote-vfs as a loadable SQLite extension"

# Builds libsqlite_remote_vfs_ext.so / .dylib. SQLite derives the entry point sqlite3_sqliteremotevfsext_init from
# the file name.
[lib]
crate-type = ["cdylib"]

[dependencies]
sqlite-remote-vfs-ffi = { version = "0.1.0", path = "../sqlite-remote-vfs-ffi" }
