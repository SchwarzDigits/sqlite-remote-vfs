[package]
name = "sqlite-remote-harness"
version = "0.6.0"
description = "Crash, fault, load and latency tests for sqlite-remote-vfs against a running server"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
sqlite-remote-vfs = { path = "../sqlite-remote-vfs" }
# Logs in like any client, with the test keys from src/key.rs.
ed25519-dalek = { version = "2", default-features = false }
getrandom = "0.3"
# SQLite3 Multiple Ciphers instead of plain SQLite, as in the VFS tests.
# The default features stay on: the build script refers to pkg-config and vcpkg, which they bring, also when it
# bundles SQLite.
libsqlite3-sys = { version = "0.36", features = ["bundled-sqlite3mc"] }
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
