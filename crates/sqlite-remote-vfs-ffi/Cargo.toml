[package]
name = "sqlite-remote-vfs-ffi"
version = "0.6.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C interface to sqlite-remote-vfs, declared in include/sqlite_remote_vfs.h"

# staticlib: for programs that link SQLite themselves. rlib: for sqlite-remote-vfs-ext, the loadable extension.
[lints]
workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sqlite-remote-vfs = { version = "0.6.0", path = "../sqlite-remote-vfs" }

[dev-dependencies]
# SQLite for the unit test binary, see src/lib.rs.
# The default features stay on: the build script refers to pkg-config and vcpkg, which they bring, also when it
# bundles SQLite.
libsqlite3-sys = { version = "0.36", features = ["bundled-sqlite3mc"] }
