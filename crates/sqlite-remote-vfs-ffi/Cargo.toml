[package]
name = "sqlite-remote-vfs-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C interface to sqlite-remote-vfs, declared in include/sqlite_remote_vfs.h"

# staticlib: for programs that link SQLite themselves. rlib: for sqlite-remote-vfs-ext, the loadable extension.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sqlite-remote-vfs = { version = "0.1.0", path = "../sqlite-remote-vfs" }
