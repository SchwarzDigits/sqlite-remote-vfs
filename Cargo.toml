[workspace]
members = ["crates/sqlite-remote-vfs", "crates/sqlite-remote-harness", "crates/sqlite-remote-protocol"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[patch.crates-io]
# Vendored libsqlite3-sys with the `bundled-sqlite3mc` feature. See vendor/libsqlite3-sys/sqlite3mc/README.md.
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }
